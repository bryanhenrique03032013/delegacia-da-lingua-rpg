<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D.L.P. — Delegacia da Língua</title><style>body{font-family:system-ui;background:#101827;color:white;max-width:700px;margin:auto;padding:20px}main{background:#172338;padding:25px;border-radius:18px}button,select{padding:14px;margin:8px 0;width:100%;border-radius:9px}button{background:#ffcf33;border:0;font-weight:bold}.answer{text-align:left;background:#29415f;color:white;border:1px solid #6580a0}</style><main><h1>🚨 D.L.P. — Delegacia da Língua</h1><p>O caso do desaparecimento de Henrique</p><label>Nível:</label><select id="level"><option>Fácil</option><option>Médio</option><option>Difícil</option></select><button onclick="start()">Começar investigação</button><section id="game"></section></main><script>const qs=[['Concordância','Qual frase está correta?',['Havia muitas pistas.','Haviam muitas pistas.'],0],['Fake news','Qual notícia é mais confiável?',['Henrique sumiu, compartilhe sem fonte.','A escola informou o caso em seu site oficial, com data e contato.'],1],['Ortografia','Complete: ___ viu a pista.',['A gente','Agente'],0],['Vocabulário','Sinônimo de pista:',['indício','rumor'],0],['Caso final','Encontramos a pista, ___ seguimos o mapa.',['portanto','porém'],0]];let i=0,s=0;function start(){i=0;s=0;show()}function show(){let q=qs[i];game.innerHTML='<h2>'+q[0]+'</h2><h3>'+q[1]+'</h3>'+q[2].map((x,n)=>'<button class="answer" onclick="ans('+n+')">'+x+'</button>').join('')}function ans(n){if(n==qs[i][3])s+=20;i++;if(i<qs.length)show();else game.innerHTML='<h2>📁 Caso encerrado!</h2><p>Você fez '+s+' pontos e encontrou Henrique!</p><button onclick="start()">Jogar novamente</button>'}</script></html>
